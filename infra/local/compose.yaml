name: b2c-medusa-local

services:
  postgres:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-password}
      POSTGRES_DB: medusa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.2-bookworm
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment: &backend-environment
      NODE_ENV: development
      DATABASE_URL: postgres://medusa:${POSTGRES_PASSWORD:-local-only-password}@postgres:5432/medusa?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEDUSA_FF_CACHING: "true"
      STOREFRONT_URL: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret}
      COOKIE_SECRET: ${COOKIE_SECRET:-local-only-cookie-secret}
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000,http://localhost:8000
      AUTH_CORS: http://localhost:9000,http://localhost:8000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_FILE_URL: ${R2_FILE_URL:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_FILE_BUCKET: ${R2_FILE_BUCKET:-}
      LOCAL_HTTP_ADMIN: "true"
      MEDUSA_WORKER_MODE: server
    command: ["npm", "run", "db:migrate", "--workspace=@b2c/backend"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend-server:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      <<: *backend-environment
      NODE_ENV: production
      MEDUSA_WORKER_MODE: server
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend-worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      <<: *backend-environment
      NODE_ENV: production
      MEDUSA_WORKER_MODE: worker
    depends_on:
      migrate:
        condition: service_completed_successfully

  storefront:
    build:
      context: ../..
      dockerfile: apps/storefront/Dockerfile
    environment:
      NODE_ENV: development
      MEDUSA_BACKEND_URL_INTERNAL: http://backend-server:9000
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://localhost:9000
      NEXT_PUBLIC_DEFAULT_REGION: us
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-replace-after-local-admin-setup}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      backend-server:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
